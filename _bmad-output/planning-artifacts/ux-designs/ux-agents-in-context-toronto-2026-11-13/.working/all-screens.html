<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DxP screens</title>
<style>
  body { margin: 0; padding: 32px; background: #EEF0F8; font-family: system-ui, sans-serif; color: #23264F; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p { margin: 0 0 24px; color: #5A5F7D; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(560px, 1fr)); gap: 28px; }
  figure { margin: 0; background: #fff; border-radius: 10px; padding: 12px; box-shadow: 0 1px 3px rgba(35,38,79,.12); }
  figcaption { font-weight: 600; margin: 0 0 8px; }
  img { width: 100%; display: block; border-radius: 6px; }
  a { color: inherit; text-decoration: none; }
</style>
</head>
<body>
<h1>DxP, all eleven screens</h1>
<p>1440 × 1000. Select a screen to open it full size.</p>
<div class="grid">
  <figure><figcaption>1. Home</figcaption><a href="shots/final-home.png"><img src="shots/final-home.png" alt="Home"></a></figure>
  <figure><figcaption>2. Diagnostics</figcaption><a href="shots/final-diagnostics.png"><img src="shots/final-diagnostics.png" alt="Diagnostics"></a></figure>
  <figure><figcaption>3. Record</figcaption><a href="shots/final-record.png"><img src="shots/final-record.png" alt="Record"></a></figure>
  <figure><figcaption>4. Find</figcaption><a href="shots/final-find.png"><img src="shots/final-find.png" alt="Find"></a></figure>
  <figure><figcaption>5. Categories</figcaption><a href="shots/final-categories.png"><img src="shots/final-categories.png" alt="Categories"></a></figure>
  <figure><figcaption>6. Graph</figcaption><a href="shots/final-graph.png"><img src="shots/final-graph.png" alt="Graph"></a></figure>
  <figure><figcaption>7. Review</figcaption><a href="shots/final-review.png"><img src="shots/final-review.png" alt="Review"></a></figure>
  <figure><figcaption>8. Rules</figcaption><a href="shots/final-rules.png"><img src="shots/final-rules.png" alt="Rules"></a></figure>
  <figure><figcaption>9. Terms</figcaption><a href="shots/final-terms.png"><img src="shots/final-terms.png" alt="Terms"></a></figure>
  <figure><figcaption>10. Alerts</figcaption><a href="shots/final-alerts.png"><img src="shots/final-alerts.png" alt="Alerts"></a></figure>
  <figure><figcaption>11. Jobs (mid-run)</figcaption><a href="shots/final-jobs.png"><img src="shots/final-jobs.png" alt="Jobs"></a></figure>
</div>
</body>
</html>
