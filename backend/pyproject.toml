[project]
name = "dxp"
version = "0.1.0"
description = "DxP backend: governed diagnostic-evidence discovery agent"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.8.0",
    "elevenlabs==2.78.0",
    "fastapi==0.162.5",
    "httpx>=0.28.1",
    "langchain-anthropic==1.7.10",
    "langgraph==1.2.21",
    "langsmith==0.14.17",
    "modal==1.6.4",
    "pydantic==2.14.3",
    "pymongo==4.19.0",
    "uvicorn[standard]>=0.54.0",
    "voyageai>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dxp"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "atlas: needs MONGODB_URI (an Atlas Sandbox test database); skipped with a stated reason when it is unset",
]
